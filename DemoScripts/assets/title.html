<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Title</title>
<style>

  *{margin:0;padding:0;box-sizing:border-box}

<body><div class="wrap">
  <div class="eyebrow">Decision memory for teams</div>
