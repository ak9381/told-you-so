<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>End</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,600;9..144,1,500&family=Inter:wght@400;500;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;background:#0A0A0B;color:#F5F5F4;font-family:'Inter',sans-serif;overflow:hidden}
  .wrap{width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(45% 55% at 50% 35%,rgba(16,185,129,.13),transparent 70%),
    radial-gradient(50% 50% at 30% 80%,rgba(192,57,43,.10),transparent 72%),#0A0A0B}
  .logo{font-family:'Fraunces',serif;font-weight:600;font-size:34px;line-height:1.05;margin-bottom:40px}
  h1{font-family:'Fraunces',serif;font-size:72px;font-weight:600;letter-spacing:-.01em;line-height:1.08;max-width:1300px}
  h1 .accent{color:#C0392B;font-style:italic}
  .url{margin-top:56px;font-size:30px;font-weight:600;color:#F5F5F4;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:18px 40px}
  .sub{font-size:20px;color:#A8A29E;margin-top:34px}
</style></head>
<body><div class="wrap">
  <div class="logo">TOLD YOU SO</div>
  <h1>Just talk. It remembers what you decided —<br/>and <span class="accent">tells you so.</span></h1>
  <div class="url">told-you-so.told-you-so.workers.dev</div>
  <div class="sub">Built hands-free by voice with Wispr Flow</div>
</div></body></html>
